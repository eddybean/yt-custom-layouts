<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      .popup {
        position: absolute;
        z-index: 10;
        top: 10px;
        right: 24px;
        width: 320px;
        height: 600px;
        border: none;
        border-radius: 10px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px #3a3a3a;
        background: #212121;
      }
    </style>
  </head>
  <body>
    <header class="caption">
      <img src="../../static/icons/icon128.png" alt="" />
      <div>
        <h1><b>かんたん設定</b>：ポップアップから切り替え・調整</h1>
        <p>5 種類のレイアウト、チャットの幅・高さ・文字サイズ、不要な要素の非表示。ショートカットキーにも対応</p>
      </div>
    </header>
    <div class="page">
      <div class="masthead"><div class="burger"></div><div class="logo"></div><div class="search" style="margin-left: 120px">検索</div><div class="me" style="margin-right: 340px"></div></div>
      <div class="scroll" style="display: flex; gap: 24px; padding: 12px 24px 0; opacity: 0.55">
        <div style="flex: 1">
          <div class="video" style="width: 100%; height: 470px">
            <div class="bar"></div>
            <div class="controls"><i></i><i></i><span class="live">ライブ</span><span class="sp"></span><i></i><i></i><i></i></div>
          </div>
          <div class="title">【サンプル】ダミー配信のタイトル</div>
          <div class="owner">
            <div class="av"></div>
            <div><div class="name">サンプルチャンネル</div><div class="subs">チャンネル登録者数 1.2万人</div></div>
          </div>
        </div>
        <div style="width: 400px">
          <div class="chat" style="height: 300px; margin-bottom: 12px">
            <div class="chat-header"><span>上位のチャット ▾</span><span>⋮</span></div>
            <div class="chat-items" data-chat="8"></div>
          </div>
          <div data-related="4"></div>
        </div>
      </div>
      <iframe class="popup" src="../.tmp/popup.html"></iframe>
    </div>
    <script src="mock.js"></script>
  </body>
</html>
