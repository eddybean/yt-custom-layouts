<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        color: #f1f1f1;
        font: 14px/1.4 'Segoe UI', 'Yu Gothic UI', Meiryo, sans-serif;
        background: radial-gradient(120% 120% at 0% 0%, #3a1512 0%, #161616 55%, #0f0f0f 100%);
      }
      .wrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        padding: 0 28px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }
      p {
        margin: 18px 0 0;
        font-size: 19px;
        font-weight: 700;
      }
      p span {
        color: #ff4e45;
      }
      small {
        display: block;
        margin-top: 6px;
        color: #aaa;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><img src="../../static/icons/icon128.png" alt="" /><h1>YT Custom Layouts</h1></div>
      <p>ライブチャットを<span>好きな位置</span>に。</p>
      <small>関連動画の上・コメントの上・オーバーレイ・左右入れ替え</small>
    </div>
  </body>
</html>
